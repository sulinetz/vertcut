<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VertCut — вертикальные клипы из длинных видео</title>
  <link rel="stylesheet" href="/static/styles.css?v=8" />
  <link rel="stylesheet" id="customFontsCss" href="/api/fonts.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Crect x='10' y='5' width='12' height='22' rx='3.5' fill='white'/%3E%3Cpath d='M14.5 12v8l6-4-6-4z' fill='%232563eb'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">
          <img src="/static/brand.png" alt="VertCut" />
        </span>
        VertCut
      </div>

      <button class="btn-new" id="newBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Новый проект
      </button>

      <button class="btn-new" id="streamBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>
        Прямой эфир
      </button>

      <div class="side-label">История</div>
      <div class="project-list" id="projectList"></div>

      <a class="update-card" id="updateCard" hidden target="_blank" rel="noopener">
        <span class="update-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
        </span>
        <span class="update-text">
          <b id="updateTitle">Доступно обновление</b>
          <small id="updateSub">Скачать с GitHub</small>
        </span>
        <button class="update-hide" id="updateHide" type="button" title="Скрыть до следующей версии" aria-label="Скрыть до следующей версии">×</button>
      </a>

      <div class="side-foot">
        <div class="health" id="health"><span class="dot"></span><span id="healthText">Проверка движка…</span></div>
        <div class="hint">Всё обрабатывается локально на этом компьютере. Видео никуда не отправляется.</div>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <div class="modal hidden" id="modal"></div>
  <div id="activeBar" class="active-bar hidden"></div>
  <div id="toasts"></div>
  <input type="file" id="fileInput" accept="video/*" class="hidden" />
  <input type="file" id="fontInput" accept=".ttf,.otf,font/ttf,font/otf" class="hidden" />
  <input type="file" id="subsInput" accept=".srt,.ass,.ssa,.vtt" class="hidden" />

  <script src="/static/app.js?v=8"></script>
</body>
</html>
