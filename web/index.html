<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VertCut — вертикальные клипы из длинных видео</title>
  <link rel="stylesheet" id="themeCss" href="/static/styles.css?v=27" />
  <link rel="stylesheet" id="customFontsCss" href="/api/fonts.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Crect x='10' y='5' width='12' height='22' rx='3.5' fill='white'/%3E%3Cpath d='M14.5 12v8l6-4-6-4z' fill='%232563eb'/%3E%3C/svg%3E" />
  <script id="themeBoot">
  (function () {
    try {
      var q = new URLSearchParams(location.search).get("theme");
      var t = q || localStorage.getItem("vertcut.theme") || "dark";
      if (q) localStorage.setItem("vertcut.theme", t);
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.motion = localStorage.getItem("vertcut.motion") || "on";
      var link = document.getElementById("themeCss");
      if (link && t === "light") link.href = "/static/styles-light.css?v=5";
    } catch (e) {}
  })();
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">
          <img src="/static/brand.png" alt="VertCut" />
        </span>
        VertCut
      </div>

      <button class="btn-new" id="newBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Новый проект
      </button>

      <button class="btn-new" id="streamBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>
        Прямой эфир
      </button>

      <button class="btn-new" id="settingsBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.4 1z"/></svg>
        Настройки
      </button>

      <button class="btn-new" id="themeBtn" title="Переключить светлую и тёмную тему">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="themeLabel">Светлая тема</span>
      </button>

      <div class="side-label">История</div>
      <div class="project-list" id="projectList"></div>

      <a class="update-card" id="updateCard" hidden target="_blank" rel="noopener">
        <span class="update-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
        </span>
        <span class="update-text">
          <b id="updateTitle">Доступно обновление</b>
          <small id="updateSub">Скачать с GitHub</small>
        </span>
        <button class="update-hide" id="updateHide" type="button" title="Скрыть до следующей версии" aria-label="Скрыть до следующей версии">×</button>
      </a>

      <div class="side-foot">
        <div class="health" id="health"><span class="dot"></span><span id="healthText">Проверка движка…</span></div>
        <div class="sysmon" id="sysmon" hidden>
          <div class="sysmon-head"><span>Нагрузка</span><span id="sysDisk" title="">—</span></div>
          <div class="sysmon-line">
            <span class="sysmon-label">CPU</span>
            <span class="sysmon-track"><i id="cpuBar"></i></span>
            <b id="cpuVal">—</b>
          </div>
          <div class="sysmon-line">
            <span class="sysmon-label">GPU</span>
            <span class="sysmon-track"><i id="gpuBar"></i></span>
            <b id="gpuVal">—</b>
          </div>
          <div class="sysmon-line">
            <span class="sysmon-label">ENC</span>
            <span class="sysmon-track"><i id="encBar"></i></span>
            <b id="encVal">—</b>
          </div>
          <div class="sysmon-foot"><span id="gpuName">GPU</span><span id="gpuTemp">—</span></div>
        </div>
        <div class="hint">Всё обрабатывается локально на этом компьютере. Видео никуда не отправляется.</div>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <div class="modal hidden" id="modal"></div>
  <div id="activeBar" class="active-bar hidden"></div>
  <div id="toasts"></div>
  <input type="file" id="fileInput" accept="video/*" class="hidden" />
  <input type="file" id="fontInput" accept=".ttf,.otf,font/ttf,font/otf" class="hidden" />
  <input type="file" id="adhdBgInput" accept=".mp4,.webm,.mov,.mkv,.m4v" class="hidden" />
  <input type="file" id="musicInput" accept=".mp3,.m4a,.aac,.wav,.ogg,.flac,.opus" class="hidden" />
  <input type="file" id="dubInput" accept=".mka,.mkv,.mp4,.m4v,.mov,.webm,.mp3,.m4a,.aac,.wav,.ogg,.flac,.opus,.ac3,.eac3,.dts,.ts" class="hidden" />
  <input type="file" id="wzFileInput" accept="video/*" class="hidden" />
  <input type="file" id="wzSubsInput" accept=".srt,.ass,.ssa,.vtt" class="hidden" />
  <input type="file" id="wzDubInput" accept=".mka,.mkv,.mp4,.m4v,.mov,.webm,.mp3,.m4a,.aac,.wav,.ogg,.flac,.opus,.ac3,.eac3,.dts,.ts" class="hidden" />
  <input type="file" id="wzMusicInput" accept=".mp3,.m4a,.aac,.wav,.ogg,.flac,.opus" class="hidden" />
  <input type="file" id="subsInput" accept=".srt,.ass,.ssa,.vtt" class="hidden" />

  <script src="/static/geometry.js?v=1"></script>
  <script src="/static/app.js?v=32"></script>
  <script src="/static/wizard.js?v=18"></script>
</body>
</html>
