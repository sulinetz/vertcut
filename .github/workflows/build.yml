name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows 10/11 x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-desktop.txt pyinstaller

      - name: Download Whisper model (optional)
        continue-on-error: true
        run: >
          python -c "from huggingface_hub import snapshot_download;
          snapshot_download('Systran/faster-whisper-small', local_dir='build/whisper-small',
          allow_patterns=['model.bin','config.json','tokenizer.json','vocabulary.txt'])"

      - name: Build
        run: pyinstaller ViralCut.spec --noconfirm --clean

      - name: Smoke test (headless HTTP)
        shell: pwsh
        run: |
          $env:VIRALCUT_HEADLESS = "1"
          $env:VIRALCUT_DATA = "$env:RUNNER_TEMP\vc-smoke"
          $env:VIRALCUT_PORT = "8799"
          $proc = Start-Process -FilePath "dist\ViralCut\ViralCut.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 80; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8799/api/health" -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) {
            if (Test-Path "$env:VIRALCUT_DATA\app.log") { Get-Content "$env:VIRALCUT_DATA\app.log" }
            throw "Приложение не ответило на /api/health"
          }
          Stop-Process -Id $proc.Id -Force

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\ViralCut -DestinationPath ViralCut-1.2.1-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ViralCut-windows-x64
          path: ViralCut-1.2.1-windows-x64.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ViralCut-windows-x64/*.zip
          generate_release_notes: true
